{% extends "base.html" %}

{% block content %}
<div class="container my-4" style="max-width: 600px;">
    <h2 class="mb-4 text-center">{{ title }}</h2>
    
    <form method="POST" class="card card-body shadow-sm">
        <div class="mb-3">
            <label class="form-label">ชื่อรายวิชา</label>
            <input type="text" name="subject" class="form-control" placeholder="เช่น คณิตศาสตร์" required>
        </div>
        
        <div class="mb-3">
            <label class="form-label">หน่วยกิต</label>
            <input type="number" name="credit" class="form-control" min="1" max="6" value="3" required>
        </div>

        <div class="mb-3">
            <label class="form-label">เกรดที่ได้</label>
            <select name="grade" class="form-select" required>
                <option value="A">A</option>
                <option value="B+">B+</option>
                <option value="B">B</option>
                <option value="C+">C+</option>
                <option value="C">C</option>
                <option value="D+">D+</option>
                <option value="D">D</option>
                <option value="F">F</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">ภาคเรียน (Semester)</label>
            <input type="number" name="semester" class="form-control" min="1" max="3" value="1" required>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-success">บันทึกวิชา</button>
            <a href="/page3" class="btn btn-outline-primary">ดูผลการคำนวณ GPA</a>
        </div>
    </form>
</div>
{% endblock %}
